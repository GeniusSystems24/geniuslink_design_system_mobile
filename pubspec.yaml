name: gl_mobile_app
description: GeniusLink Mobile — full multi-screen app (MVC) ported from the web UI kit.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # State management — BLoC (Cubit-first). Migration from ChangeNotifier /
  # setState to flutter_bloc, designed for multi-tenant + database-per-tenant
  # isolation. See bloc-state-management-plan.md.
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5
  # Legacy widget kit retained for screens that have not yet moved to a
  # focused Super package.
  geniuslink_design_system: ^2.8.1

  # Single source of truth for the complete Material theme and shared tokens.
  super_core: ^3.0.0

  # Standard text, numeric, date, select, attachment and boolean fields.
  super_form_field: ^1.4.0

  # Typeahead / combobox fields. Keep this package for searchable master-data
  # selectors, SKU entry and global spotlight search.
  super_auto_suggestion_box: ^0.9.0

  # Focused Super widgets used by the remaining non-form interfaces. These
  # versions share the super_core >=1.2.0 <2.0.0 foundation.
  super_table_field: ^2.4.0
  super_tree_field: ^0.5.0
  super_tab_bar: ^2.8.0

  go_router: ^17.2.3

dev_dependencies:
  build_runner: ^2.4.0
  go_router_builder: ^4.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # BLoC testing — state-machine assertions + mocking for the per-tenant
  # isolation tests (Phase 9).
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Fonts fall back to the platform UI font until the GL families are added
  # under assets/fonts/ (Manrope · Inter · JetBrainsMono · NotoNaskhArabic).
