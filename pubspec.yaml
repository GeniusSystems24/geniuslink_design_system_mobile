name: gl_mobile_app
description: GeniusLink Mobile — full multi-screen app (MVC) ported from the web UI kit.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # State management — BLoC (Cubit-first). Migration from ChangeNotifier /
  # setState to flutter_bloc, designed for multi-tenant + database-per-tenant
  # isolation. See bloc-state-management-plan.md.
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  # The shared GeniusLink Design System (sibling package) — provides the
  # remaining monolith kit widgets (and the TreeTheme* tokens until fully
  # migrated). Path-resolved against the project root.
  geniuslink_design_system: ^2.8.1
  # Focused GeniusLink form-field package — consumed by adapters/form/m_inputs.dart.
  super_form_field: ^1.0.0
  # Focused GeniusLink suggestion / combobox package — the AutoSuggestionsBox
  # behind MSuggest (local + remote sources, prefix/contains/fuzzy, free-text).
  # Consumed by adapters/form/m_inputs.dart.
  super_auto_suggestion_box: ^0.5.0
  # Focused GeniusLink table package — backs MTable (ReadableTable<T> read grid).
  # Consumed by adapters/table/m_table.dart.
  super_table_field: ^1.0.0
  # Focused GeniusLink tree package — the hierarchical Tree<T> behind the
  # Account Tree screen (TreeNode<T> · TreeController<T> · search · expand /
  # collapse · keyboard nav · indent guides). Consumed by accounts screens.
  super_tree_field: ^0.3.0
  super_navigation_sidebar:
    path: ../super_navigation_sidebar
  super_tab_bar:
    path: ../super_tab_bar

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # BLoC testing — state-machine assertions + mocking for the per-tenant
  # isolation tests (Phase 9).
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Fonts fall back to the platform UI font until the GL families are added
  # under assets/fonts/ (Manrope · Inter · JetBrainsMono · NotoNaskhArabic).
