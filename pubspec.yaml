name: gl_mobile_app
description: GeniusLink Mobile — full multi-screen app (MVC) ported from the web UI kit.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management uses presentation-owned ChangeNotifier controllers (MVC).
  equatable: ^2.0.5
  # Legacy widget kit retained for screens that have not yet moved to a
  # focused Super package.
  geniuslink_design_system: ^2.8.1

  # Single source of truth for the complete Material theme and shared tokens.
  super_core: ^3.6.0

  # Standard text, numeric, date, select, attachment and boolean fields.
  super_form_field: ^1.14.0

  # Typeahead / combobox fields. Keep this package for searchable master-data
  # selectors, SKU entry and global spotlight search.
  super_auto_suggestion_box: ^1.5.0

  # Focused Super widgets used by the remaining non-form interfaces.
  # Keep these versions aligned with the current super_core foundation.
  super_table_field: ^3.1.1
  super_tree_field: ^2.0.0
  super_tab_bar: ^2.9.0
  super_navigation_sidebar: ^3.3.0

  go_router: ^17.2.3

dev_dependencies:
  intl_utils: ^2.8.14
  build_runner: ^2.4.0
  go_router_builder: ^4.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # The following section is specific to Flutter.
  generate: true # Add this line
  # Fonts fall back to the platform UI font until the GL families are added
  # under assets/fonts/ (Manrope · Inter · JetBrainsMono · NotoNaskhArabic).
